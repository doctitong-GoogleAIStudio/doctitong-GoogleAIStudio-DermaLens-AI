# nginx reverse proxy for the backend, for hosts already running nginx
# (use deploy/Caddyfile instead if you want automatic certificates).
#
#   sudo cp deploy/nginx-api.conf /etc/nginx/sites-available/dermalens
#   sudo ln -s /etc/nginx/sites-available/dermalens /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.aivicventures.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.aivicventures.com;

    # certbot replaces this block with a 301 to https once it has issued a cert.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.aivicventures.com;

    # Filled in by certbot.
    ssl_certificate     /etc/letsencrypt/live/api.aivicventures.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aivicventures.com/privkey.pem;

    # The app posts base64-encoded photos to /api/analyze — up to 4 of them.
    client_max_body_size 32m;

    # Gemini analysis can take a while; do not cut it off at the default 60s.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
